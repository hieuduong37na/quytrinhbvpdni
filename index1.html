<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist quy trình</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ck_theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2b34;--paper:#f4f7f6;--card:#fff;--line:#d5dfdc;--pri:#0b6e6e;--pri2:#e3f1f0;--warn:#b45309;--bad:#b42318;--mut:#5d6f77}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
header b{font-size:17px}header small{color:var(--mut);display:block;line-height:1.3}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{white-space:nowrap;background:none;border:0;padding:8px 12px;border-radius:8px;font:inherit;color:var(--mut);cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0}
select,input,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:110px}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:500;cursor:pointer}
button.btn.sec{background:var(--pri2);color:var(--pri)}
button.lnk{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;padding:4px 6px}
button.lnk.d{color:var(--bad)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px;margin:0;cursor:pointer}
.step input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.step.done span{color:var(--mut);text-decoration:line-through}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
.mut{color:var(--mut);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:9}
.toast.err{background:var(--bad)}
.login{max-width:360px;margin:12vh auto 0}
h2{font-size:18px;margin:16px 0 4px}
.tag{font-size:12px;background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:20px}
#sheet{display:none}
.qv{margin-top:8px;border-top:1px solid var(--line)}.qs{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.qs.bad{color:var(--bad);font-weight:500}
.paper{background:#fff;color:#000;font:15px/1.4 "Times New Roman",Times,serif;border:1px solid var(--line);padding:8px;margin:10px 0;overflow-x:auto}
.ck{width:100%;border-collapse:collapse;background:#fff;margin:0 0 -1px}
.ck th,.ck td{border:1px solid #777;padding:8px 8px;vertical-align:middle}
.ck th{background:#fff;text-align:center;font-weight:700}
.ck .c{text-align:center}.ck td.s{font-weight:700;background:#eee}
.ck td.cl{cursor:pointer;padding:0;height:46px;-webkit-tap-highlight-color:transparent}
.ck td.cl:hover{background:#f3f3f3}.ck td.cl:active{background:#e6e6e6}
.ch{display:block;line-height:44px;font-size:22px;color:transparent;user-select:none}
.ch.on{color:#000}
.hd{margin-bottom:-1px}.hd td{text-align:center;font-size:15px}
h3.sec{font-size:15px;margin:16px 0 0;padding:6px 10px;background:var(--pri2);color:var(--pri);border-radius:6px}
/* hiệu ứng nhấn nút */
button,.ck td.cl,.step,nav button{transition:transform .12s ease,filter .15s ease,background-color .15s ease,box-shadow .15s ease}
button.btn:hover{filter:brightness(1.08);box-shadow:0 2px 8px rgba(11,110,110,.28)}
button.btn.sec:hover{filter:brightness(.97)}
button.lnk:hover,nav button:not(.on):hover{background:var(--pri2)}
button:active:not(:disabled),.step:active{transform:scale(.95)}
button:disabled{opacity:.6;cursor:wait}
.rp-w{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
.btn.sec .rp-w,.lnk .rp-w,td.cl .rp-w,nav button:not(.on) .rp-w{background:rgba(11,110,110,.22)}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.ch.on{animation:pop .28s ease-out}
.toast{animation:tin .25s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.remember{display:flex;align-items:center;gap:8px;margin:10px 0 14px;font-size:14px;color:var(--ink);cursor:pointer}
.remember input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--pri)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.subtabs,.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.subtabs button,.chips button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer}
.subtabs button.on,.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;text-align:center}
.card.picked{border-color:var(--pri);background:var(--pri2)}
.pk{width:22px;height:22px;margin:0 8px 0 0;flex:none;accent-color:var(--pri)}
.selbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-top:1px solid var(--line);padding:10px 0;margin-top:8px;z-index:5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.dlg{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px;max-height:88vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:640px){.ov{align-items:center}.dlg{border-radius:14px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}.kpi{margin:0}.kpi b{font-size:22px;display:block;line-height:1.2}
.tw{overflow-x:auto}.rt{width:100%;border-collapse:collapse;font-size:14px;background:#fff}.rt th,.rt td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}.rt th{color:var(--mut);font-weight:500}.rt .n{text-align:right;white-space:nowrap}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--pri)}
@page{size:A4;margin:15mm}
@media print{body{background:#fff}#app,.toast{display:none!important}
#sheet{display:block;font:12pt/1.35 "Times New Roman",serif;color:#000}
#sheet table{width:100%;border-collapse:collapse;margin:0 0 4mm}
#sheet td,#sheet th{border:1px solid #000;padding:1.5mm 2mm;vertical-align:middle}
#sheet .c,#sheet th{text-align:center}#sheet .t{font-weight:700}
#sheet td.s{font-weight:700;background:#eee}
#sheet .lg{width:28mm;text-align:center}#sheet .lg img{max-width:24mm}
#sheet .info td{border:0;padding:1mm 0}#sheet .hdr td{border:0}#sheet tr{page-break-inside:avoid}
#sheet .fn{font-size:10pt;font-style:italic}}

/* ===== trạng thái đang lưu / thành công / xóa ===== */
.spin{display:inline-block;width:.9em;height:.9em;margin-right:7px;vertical-align:-.12em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button.busy:disabled,button.ok:disabled{opacity:.9;cursor:progress}
button.busy .rp-w,button.ok .rp-w{display:none}
button.btn.ok{background:#15803d;color:#fff}
button.btn.sec.ok{background:#dcfce7;color:#15803d}
button.lnk.ok{color:#15803d;font-weight:500}
button.ok{animation:okpop .32s ease-out}
@keyframes okpop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
body.working #app,body.working .ov{pointer-events:none}
body.working{cursor:progress}
.card.leaving{overflow:hidden;pointer-events:none;animation:leave .4s ease-in forwards}
@keyframes leave{from{max-height:300px}to{opacity:0;transform:translateX(28px);max-height:0;padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;border-width:0}}
main.formin{animation:formin .25s ease-out}
@keyframes formin{from{opacity:0;transform:translateY(10px)}}
button.btn.bad{background:var(--bad)}
button.btn.bad:hover{box-shadow:0 2px 8px rgba(180,35,24,.3)}
.loadbox{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 0 6px;color:var(--pri);font-weight:500}
.spin.big{width:1.3em;height:1.3em;margin:0;border-width:3px}
.skel{height:76px;border-radius:10px;margin:8px 0;background:linear-gradient(90deg,#e6edeb 25%,#f4f7f6 50%,#e6edeb 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}


/* ===== Tối ưu mobile + PC ===== */
html{-webkit-text-size-adjust:100%}
button,.step,.ck td.cl{-webkit-tap-highlight-color:transparent}
.card,.step{overflow-wrap:anywhere}
header>div:first-child{min-width:0}
.g2{display:grid;grid-template-columns:1fr;gap:0 14px}
.stick{position:sticky;top:0;z-index:4;background:var(--paper);padding:2px 0 6px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){main.formin{max-width:680px}#nvl{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}}
@media(min-width:1024px){.wrap{max-width:980px;padding-top:18px}header b{font-size:18px}.card{padding:14px 18px}}
@media(max-width:480px){.wrap{padding:10px 10px 60px}header{gap:6px}header small{font-size:12px}.ck th,.ck td{padding:6px 5px}.rt{font-size:13px}.rt th,.rt td{padding:6px 4px}.kpis{grid-template-columns:1fr 1fr}.dlg{padding:14px}}
@media(pointer:coarse){button.lnk{min-height:40px;padding:8px 10px}nav button{padding:11px 14px}.ck td.cl{height:54px}.ch{line-height:52px}}
@media(hover:none){button.btn:hover{filter:none;box-shadow:none}button.lnk:hover,nav button:not(.on):hover{background:none}}
/* ===== Giao diện tối (mặc định) / sáng: đổi bằng nút 🌙 ☀️ ===== */
:root{color-scheme:light}
.thb{padding:10px 12px;line-height:1;font-size:16px}
.th-float{position:fixed;top:10px;right:12px;z-index:5}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e6efed;--paper:#0f171a;--card:#172226;--line:#2c3d42;--pri:#4fd1c5;--pri2:#1a3a3c;--prib:#0e7f79;--warn:#f5a524;--bad:#ff8f86;--mut:#97aeb3}
[data-theme="dark"] select,[data-theme="dark"] input,[data-theme="dark"] textarea{background:#101a1d}
[data-theme="dark"] button.btn:not(.sec):not(.bad):not(.ok),[data-theme="dark"] nav button.on,[data-theme="dark"] .subtabs button.on,[data-theme="dark"] .chips button.on{background:var(--prib);border-color:var(--prib);color:#fff}
[data-theme="dark"] .subtabs button:not(.on),[data-theme="dark"] .chips button:not(.on){background:var(--card)}
[data-theme="dark"] button.btn.bad,[data-theme="dark"] .toast.err,[data-theme="dark"] .badge{background:#c62828;color:#fff}
[data-theme="dark"] .toast:not(.err){background:#e6efed;color:#10181b}
[data-theme="dark"] button.btn.sec.ok{background:#12351f;color:#6ee7a0}
[data-theme="dark"] button.lnk.ok{color:#6ee7a0}
[data-theme="dark"] .selbar,[data-theme="dark"] .dlg{background:var(--card)}
[data-theme="dark"] .rt{background:transparent}
[data-theme="dark"] .ov{background:rgba(0,0,0,.65)}
[data-theme="dark"] .paper,[data-theme="dark"] .ck,[data-theme="dark"] .ck th{background:#1a2529;color:var(--ink)}
[data-theme="dark"] .ck th,[data-theme="dark"] .ck td{border-color:#5b6e74}
[data-theme="dark"] .ck td.s{background:#26363b}
[data-theme="dark"] .ck td.cl:hover{background:#223035}
[data-theme="dark"] .ck td.cl:active{background:#2b3b40}
[data-theme="dark"] .ch.on{color:var(--ink)}
[data-theme="dark"] .skel{background:linear-gradient(90deg,#1c2a2f 25%,#26373d 50%,#1c2a2f 75%);background-size:200% 100%}
/* in ấn luôn giữ nền trắng chữ đen */
@media print{:root[data-theme]{color-scheme:light}body{background:#fff!important;color:#000!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
/* URL ứng dụng web (Apps Script). Nếu tạo bản triển khai mới thì thay URL ở dòng dưới */
const API = "https://script.google.com/macros/s/AKfycbyR8QgB2T1gDGlpB65JczGDrLeCUtxJdiIfAsbyHSiOB3ttXw1QJO-BoieTrAP3Xlr6/exec";
const ORG = "BỆNH VIỆN PHỔI ĐỒNG NAI"; // dùng khi quy trình không có tiêu đề riêng
const LOGO = ""; // dán ảnh logo dạng data:image/png;base64,... (để trống nếu không dùng)

const S = {token:null,user:null,d:null,tab:'chk',khoa:'',qid:'',chk:[],edit:null,hist:[]};
const $ = s => document.querySelector(s);
const can = p => !!S.user && (S.user.role === 'admin' || (S.user.perms || []).includes(p));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const curTheme = () => { let t = null; try { t = localStorage.getItem('ck_theme'); } catch (e) {} return t === 'light' ? 'light' : 'dark'; };
function toggleTheme() {
  const n = curTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('ck_theme', n); } catch (e) {}
  document.documentElement.dataset.theme = n;
  document.querySelectorAll('.thb').forEach(b => { b.textContent = n === 'dark' ? '☀️' : '🌙'; });
}
const themeBtn = () => `<button class="btn sec thb" onclick="toggleTheme()" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">${curTheme() === 'dark' ? '☀️' : '🌙'}</button>`;
const ROLE = {admin:'Quản trị', truong:'Trưởng khoa/phòng', nhanvien:'Nhân viên'};
const opt = (v, cur, t) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t ?? v)}</option>`;

function toast(m, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5500 : 2800);
}
async function call(action, p = {}) {
  const r = await fetch(API, {method:'POST', body:JSON.stringify({action, token:S.token, ...p})});
  const j = await r.json();
  if (j.error) { if (j.error === 'EXPIRED') { logout(); throw new Error('Phiên đăng nhập hết hạn, hãy đăng nhập lại'); } throw new Error(j.error); }
  return j;
}
/* hiệu ứng gợn sóng khi nhấn */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('button, td.cl'); if (!el || el.disabled) return;
  if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
  el.style.overflow = 'hidden';
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, w = document.createElement('span');
  w.className = 'rp-w'; w.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  el.appendChild(w); setTimeout(() => w.remove(), 600);
});
/* ---------- Nút đang xử lý: chỉ trở lại sau khi server báo lưu thành công ---------- */
let LB = null, CUR = null, BUSY = false;
document.addEventListener('click', e => { LB = e.target.closest('button.btn, button.lnk'); setTimeout(() => { LB = null; }, 0); }, true);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const VERB = [
  [/^(\+\s*)?thêm/i, 'Đang thêm...', '✓ Đã thêm'],
  [/^lưu/i, 'Đang lưu...', '✓ Đã lưu'],
  [/^(xóa|xoá)/i, 'Đang xóa...', '✓ Đã xóa'],
  [/^gửi/i, 'Đang gửi...', '✓ Đã gửi'],
  [/^nhập/i, 'Đang nhập...', '✓ Đã nhập'],
  [/^xem/i, 'Đang tải...', '✓ Xong']
];
async function run(fn) {
  const btn = LB && !LB.disabled && document.body.contains(LB) ? LB : null; LB = null;
  if (btn && BUSY) return;                       // chặn bấm đúp
  let orig = null;
  if (btn) {
    BUSY = true; CUR = btn;
    const v = VERB.find(x => x[0].test(btn.textContent.trim())) || [0, 'Đang xử lý...', '✓ Xong'];
    orig = {html: btn.innerHTML.replace(/<span class="rp-w"[^>]*><\/span>/g, ''), w: btn.style.minWidth};
    btn.style.minWidth = btn.offsetWidth + 'px';
    btn.disabled = true; btn.classList.add('busy'); btn.dataset.ok = v[2];
    btn.innerHTML = `<i class="spin"></i>${v[1]}`;
    document.body.classList.add('working');
  }
  try { await fn(); } catch (e) { toast(e.message, 1); }
  finally {
    if (btn) {
      BUSY = false; CUR = null; document.body.classList.remove('working');
      if (document.body.contains(btn)) { btn.disabled = false; btn.classList.remove('busy', 'ok'); btn.innerHTML = orig.html; btn.style.minWidth = orig.w; delete btn.dataset.ok; }
    }
  }
}
/* gọi ngay sau khi server báo thành công: nút chuyển sang "✓ Đã lưu" (hoặc thẻ mờ dần khi xóa) rồi mới quay lại */
async function okFx() {
  const b = CUR; if (!b || !document.body.contains(b)) return;
  b.classList.remove('busy'); b.classList.add('ok'); b.innerHTML = b.dataset.ok || '✓ Xong';
  const del = /xóa/i.test(b.dataset.ok || '');
  if (del) { const c = b.closest('.card'); if (c) c.classList.add('leaving'); }
  await sleep(del ? 420 : 650);
}

/* ---------- Cảnh báo khi chưa lưu mà thoát ---------- */
const erSnap = () => formSnap() + '\u0002' + JSON.stringify((S.er || {}).chk);
const formSnap = () => [...document.querySelectorAll('#app main input, #app main select, #app main textarea')]
  .map(e => e.type === 'checkbox' || e.type === 'radio' ? (e.checked ? 1 : 0) : e.value).join('\u0001');
function dirtyMsg() {
  if (!S.user) return '';
  if (S.edit && S.snap != null && (S.tab === 'qt' || S.tab === 'nv') && formSnap() !== S.snap)
    return 'Thông tin bạn đang nhập chưa được lưu. Nếu thoát, các thay đổi sẽ bị mất.';
  if (S.er && S.snap != null && erSnap() !== S.snap) return 'Phiếu đang sửa chưa được lưu. Nếu thoát, các thay đổi sẽ bị mất.';
  if (S.tab === 'chk' && !S.last && S.qid && (S.chk.some(v => v === 0 || v === 1) || (($('#note') || {}).value || '').trim()))
    return 'Checklist đang làm dở chưa được lưu. Nếu thoát, các bước đã đánh giá sẽ bị mất.';
  return '';
}
function askLeave(msg, onLeave, onStay) {
  if ($('#lv')) return;
  const o = document.createElement('div'); o.className = 'ov'; o.id = 'lv';
  const close = cb => { o.remove(); if (cb) cb(); };
  o.onclick = e => { if (e.target === o) close(onStay); };
  o.onkeydown = e => { if (e.key === 'Escape') close(onStay); };
  o.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h2 style="margin-top:0">⚠ Chưa lưu thay đổi</h2><p style="margin:6px 0 16px">${esc(msg)}</p>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn sec" id="lv-stay">Ở lại</button><button class="btn bad" id="lv-out">Thoát, không lưu</button></div></div>`;
  document.body.appendChild(o);
  $('#lv-stay').onclick = () => close(onStay); $('#lv-out').onclick = () => close(onLeave);
  $('#lv-stay').focus();
}
function leave(fn, stay) { const m = dirtyMsg(); if (m) askLeave(m, fn, stay); else fn(); }
function cancelEdit() { leave(() => { S.edit = null; render(); }); }
/* nút Back của điện thoại / trình duyệt + đóng tab */
let guardOn = false;
function syncGuard() { if (!guardOn && dirtyMsg()) { try { history.pushState({ck:1}, ''); guardOn = true; } catch (e) {} } }
document.addEventListener('input', syncGuard);
window.addEventListener('beforeunload', e => { if (dirtyMsg()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('popstate', () => {
  if (!guardOn) return;
  guardOn = false;
  if (!dirtyMsg()) { history.back(); return; }
  askLeave(dirtyMsg(), () => history.back(), syncGuard);
});

/* ---------- Đăng nhập ---------- */
async function login() {
  const btn = $('#lb'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Đang đăng nhập...'; }
  await run(async () => {
    const u = $('#u').value.trim(), pw = $('#p').value, rem = $('#rem') && $('#rem').checked;
    const j = await call('login', {username:u, password:pw});
    try { if (rem) localStorage.setItem('ck_cred', JSON.stringify({u, p:btoa(unescape(encodeURIComponent(pw)))})); else localStorage.removeItem('ck_cred'); } catch (e) {}
    S.token = j.token; S.user = j.user;
    try { sessionStorage.setItem('ck', JSON.stringify({token:j.token, user:j.user})); } catch (e) {}
    await reload(); S.tab = 'chk'; render();
  });
  const b2 = $('#lb'); if (b2) { b2.disabled = false; b2.textContent = 'Đăng nhập'; }
}
function logout() {
  S.token = S.user = S.d = null; S.rp = S.rf = S.inbox = S.last = null; S.er = null; S.hist = []; S.sel = []; S.selMode = false; S.hsub = ''; S.rkh = undefined;
  try { sessionStorage.removeItem('ck'); } catch (e) {}
  render();
}
async function reload() {
  S.d = await call('data');
  if (S.d.me) Object.assign(S.user, S.d.me);
  if (!S.d.khoa.includes(S.khoa)) S.khoa = S.user.khoa && S.d.khoa.includes(S.user.khoa) ? S.user.khoa : (S.d.khoa[0] || '');
}

/* ---------- Khung chính ---------- */
function render() {
  const app = $('#app');
  if (!S.user) {
    let rc = {}; try { rc = JSON.parse(localStorage.getItem('ck_cred')) || {}; } catch (e) {}
    app.innerHTML = `<div class="login"><span class="th-float">${themeBtn()}</span><h2>Đăng nhập checklist quy trình</h2>
      <label>Tên đăng nhập<input id="u" autocomplete="username" value="${esc(rc.u || '')}" onkeydown="if(event.key==='Enter')$('#p').focus()"></label>
      <label>Mật khẩu<input id="p" type="password" autocomplete="current-password" value="${esc(rc.p ? decodeURIComponent(escape(atob(rc.p))) : '')}" onkeydown="if(event.key==='Enter')login()"></label>
      <label class="remember"><input id="rem" type="checkbox" ${rc.u ? 'checked' : ''}>Nhớ tài khoản và mật khẩu</label>
      <button class="btn" id="lb" onclick="login()">Đăng nhập</button>
      </div>`;
    return;
  }
  const u = S.user, tabs = [];
  if (can('lam')) tabs.push(['chk', 'Checklist']);
  if (can('xemls') || can('nhan')) tabs.push(['hist', 'Lịch sử' + (S.d && S.d.moi ? ` <span class="badge">${S.d.moi}</span>` : '')]);
  if (can('baocao')) tabs.push(['bc', 'Báo cáo']);
  if (can('qt')) tabs.push(['qt', 'Quy trình']);
  if (u.role === 'admin') tabs.push(['nv', 'Nhân sự & Khoa/phòng']); else if (can('nhansu')) tabs.push(['nv', 'Nhân sự']);
  if (tabs.length && !tabs.some(t => t[0] === S.tab)) { S.tab = tabs[0][0]; if (S.tab === 'hist') setTimeout(loadHist, 0); }
  app.innerHTML = `<header><div><b>${esc(u.hoten)}</b><small>${esc(u.chucdanh)} · ${esc(ROLE[u.role])}${u.khoa ? ' · ' + esc(u.khoa) : ''}</small></div>
    <div style="display:flex;gap:6px;align-items:center">${themeBtn()}<button class="btn sec" onclick="leave(logout)">Đăng xuất</button></div></header>
    <nav>${tabs.map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>
    <main>${tabs.length ? {chk:tabChk, hist:tabHist, bc:tabBc, qt:tabQt, nv:tabNv}[S.tab]() : '<p class="mut">Tài khoản chưa được cấp quyền thao tác nào. Hãy liên hệ quản trị.</p>'}</main>`;
  if (S.tab === 'hist') updSel();
  const mn = $('#app main'); if (mn && (S.edit || S.imp) && (S.tab === 'qt' || S.tab === 'nv')) mn.classList.add('formin');
  S.snap = S.er ? erSnap() : S.edit && !S.imp && (S.tab === 'qt' || S.tab === 'nv') ? formSnap() : null;
  syncGuard();
}
function go(t) {
  const d = !!dirtyMsg();
  leave(() => { if (d && S.tab === 'chk') { S.qid = ''; S.chk = []; } goNow(t); });
}
function goNow(t) { S.er = null; S.last = null; S.tab = t; S.edit = null; S.xfer = null; S.q = ''; S.selMode = false; if (t === 'hist') loadHist(); else { render(); if (t === 'bc' && !S.rp) loadReport(); }  }
function setKhoa(v, el) { leave(() => setKhoaNow(v), () => { if (el) el.value = S.khoa; }); }
function setKhoaNow(v) { S.khoa = v; S.qid = ''; S.chk = []; if (S.tab === 'hist') loadHist(); else render(); }
const khoaSel = () => `<label>Khoa/phòng<select onchange="setKhoa(this.value,this)" ${S.user.role === 'admin' ? '' : 'disabled'}>${S.d.khoa.map(k => opt(k, S.khoa)).join('')}</select></label>`;

/* ---------- Checklist ---------- */
const isSec = b => b.startsWith('# ');
const pad = n => String(n).padStart(2, '0');
function nowLocal() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtVN(v) { const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(v || ''); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]}` : ''; }
function hkey(t) { const m = /(\d+)\/(\d+)\/(\d+)\D+(\d+):(\d+)/.exec(t || ''); return m ? m[3] + pad(m[2]) + pad(m[1]) + pad(m[4]) + pad(m[5]) : ''; }
const qOf = k => S.d.qt.filter(x => x.khoa === k || x.khoa === '*');
function tabChk() {
  if (S.last) return `<div class="card"><b>Đã lưu checklist</b><div class="mut">${esc(S.last.qt)} · ${esc(S.last.khoa)} · ${esc(S.last.tile)} bước đạt</div></div><button class="btn" onclick="printRec(S.last)">In phiếu checklist</button> ${can('gui') ? '<button class="btn" onclick="showSend([S.last])">Gửi phiếu</button>' : ''} <button class="btn sec" onclick="S.last=null;render()">Kiểm tra lần mới</button>`;
  const qts = qOf(S.khoa), q = qts.find(x => x.id === S.qid), staff = S.d.nv.filter(x => x.khoa === S.khoa);
  let h = '<div class="g2">' + khoaSel() + `<label>Quy trình<select onchange="pick(this.value,this)"><option value="">— Chọn quy trình —</option>${qts.map(x => opt(x.id, S.qid, x.ten)).join('')}</select></label></div>`;
  if (!qts.length) h += `<p class="mut">Khoa/phòng này chưa có quy trình nào.</p>`;
  if (q) {
    const me = staff.find(x => x.username === S.user.username), m = q.meta || {}, L = m.nhan || ['Đạt', 'Không đạt'];
    let n = 0;
    const rows = q.buoc.map((b, i) => {
      if (isSec(b)) { n = 0; return `<tr><td colspan="4" class="s">${esc(b.slice(2))}</td></tr>`; }
      n++;
      return `<tr id="r${i}"><td class="c">${n}</td><td>${esc(b)}</td><td class="c cl" onclick="mark(${i},1)"><span class="ch ${S.chk[i] === 1 ? 'on' : ''}">✓</span></td><td class="c cl" onclick="mark(${i},0)"><span class="ch no ${S.chk[i] === 0 ? 'on' : ''}">✓</span></td></tr>`;
    }).join('');
    h += `<div class="g2"><label>Người thực hiện<select id="who">${staff.map(x => opt(x.id, me ? me.id : '', x.hoten)).join('')}</select></label>
      <label>Thời gian thực hiện<input id="when" type="datetime-local" value="${nowLocal()}"></label></div>
      <div class="stick"><div class="bar"><i id="pb" style="width:0"></i></div><div class="mut" id="pt"></div></div>
      <div class="paper"><table class="ck hd"><tr><td>${esc(m.org || ORG)}<br><b>${esc(m.dept || '')}</b></td></tr><tr><td><b>${esc(m.title || q.ten.toUpperCase())}</b>${m.sub ? `<br>(${esc(m.sub)})` : ''}</td></tr></table>
      <table class="ck"><tr><th rowspan="2" style="width:36px">STT</th><th rowspan="2">Nội dung</th><th colspan="2">Lượng giá</th></tr>
      <tr><th style="width:54px">${esc(L[0])}</th><th style="width:54px">${esc(L[1])}</th></tr>${rows}
      <tr><td colspan="2" class="c"><b>Kết quả</b></td><td colspan="2" class="c"><b id="kq">0/${S.tot}</b></td></tr></table></div>
      <label>Ghi chú<textarea id="note" style="min-height:70px"></textarea></label>
      <button class="btn" onclick="save()">Lưu checklist</button>`;
  }
  setTimeout(bar, 0);
  return h;
}
function pick(id, el) { leave(() => pickNow(id), () => { if (el) el.value = S.qid; }); }
function pickNow(id) { S.qid = id; const q = S.d.qt.find(x => x.id === id); S.chk = q ? q.buoc.map(() => null) : []; S.tot = q ? q.buoc.filter(b => !isSec(b)).length : 0; render(); }
function mark(i, v) {
  const A = S.er || S;
  A.chk[i] = A.chk[i] === v ? null : v;
  const c = $('#r' + i).querySelectorAll('.ch'); c[0].classList.toggle('on', A.chk[i] === 1); c[1].classList.toggle('on', A.chk[i] === 0);
  bar(); syncGuard();
}
function bar() {
  const b = $('#pb'); if (!b) return;
  const A = S.er || S, a = A.chk.filter(v => v === 0 || v === 1).length, d = A.chk.filter(v => v === 1).length;
  b.style.width = (A.tot ? a / A.tot * 100 : 0) + '%'; $('#pt').textContent = `Đã đánh giá ${a}/${A.tot} bước · ${d} bước đạt`; $('#kq').textContent = `${d}/${A.tot}`;
}
function save() {
  run(async () => {
    const q = S.d.qt.find(x => x.id === S.qid), nv = S.d.nv.find(x => x.id === $('#who').value);
    if (!nv) throw new Error('Khoa/phòng chưa có nhân viên để ghi nhận');
    const a = S.chk.filter(v => v === 0 || v === 1).length, d = S.chk.filter(v => v === 1).length;
    if (a < S.tot && !confirm(`Còn ${S.tot - a} bước chưa đánh giá. Vẫn lưu?`)) return;
    const rec = {t:fmtVN($('#when').value) || fmtVN(nowLocal()), khoa:S.khoa, qt:q.ten, nguoi:nv.hoten, cd:nv.chucdanh, tile:`${d}/${S.tot}`,
      ct:q.buoc.map((b, i) => isSec(b) ? b : (S.chk[i] === 1 ? '✔ ' : S.chk[i] === 0 ? '✘ ' : '○ ') + b).join('\n'), ghichu:$('#note').value};
    await call('log', {thoigian:rec.t, khoa:rec.khoa, quytrinh:rec.qt, nguoi:rec.nguoi, chucdanh:rec.cd, tile:rec.tile, chitiet:rec.ct, ghichu:rec.ghichu});
    await okFx();
    S.last = rec; toast('Đã lưu vào Google Sheet'); S.chk = q.buoc.map(() => null); render();
  });
}

/* ---------- Sửa phiếu checklist đã lưu ---------- */
function parseCt(ct) {
  const buoc = [], chk = [];
  String(ct || '').split('\n').filter(Boolean).forEach(l => {
    if (isSec(l)) { buoc.push(l); chk.push(null); return; }
    buoc.push(l.slice(2)); chk.push(l[0] === '✔' ? 1 : l[0] === '✘' ? 0 : null);
  });
  return {buoc, chk, tot: buoc.filter(b => !isSec(b)).length};
}
function toLocal(t) { const m = /(\d+)\/(\d+)\/(\d+)\D+(\d+):(\d+)/.exec(t || ''); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}T${pad(m[4])}:${pad(m[5])}` : nowLocal(); }
function editRec(i) {
  const r = S.hist[i], p = parseCt(r.ct);
  if (!p.tot) return toast('Phiếu này không có chi tiết để sửa', 1);
  const q = S.d.qt.find(x => x.ten === r.qt && x.khoa === r.khoa) || S.d.qt.find(x => x.ten === r.qt) || {};
  S.er = {rec:r, i, buoc:p.buoc, chk:p.chk, tot:p.tot, meta:q.meta || {}};
  S.open = null; S.selMode = false; S.sel = []; render(); window.scrollTo(0, 0);
}
function cancelEr() { leave(() => { S.er = null; render(); }); }
function tabEdit() {
  const e = S.er, r = e.rec, m = e.meta, L = m.nhan || ['Đạt', 'Không đạt'];
  const staff = S.d.nv.filter(x => x.khoa === r.khoa), cur = staff.find(x => x.hoten === r.nguoi);
  let n = 0;
  const rows = e.buoc.map((b, i) => {
    if (isSec(b)) { n = 0; return `<tr><td colspan="4" class="s">${esc(b.slice(2))}</td></tr>`; }
    n++;
    return `<tr id="r${i}"><td class="c">${n}</td><td>${esc(b)}</td><td class="c cl" onclick="mark(${i},1)"><span class="ch ${e.chk[i] === 1 ? 'on' : ''}">✓</span></td><td class="c cl" onclick="mark(${i},0)"><span class="ch no ${e.chk[i] === 0 ? 'on' : ''}">✓</span></td></tr>`;
  }).join('');
  setTimeout(bar, 0);
  return `<h2 style="margin-top:0">Sửa phiếu checklist</h2>
    <div class="card"><b>${esc(r.qt)}</b><div class="mut">${esc(r.khoa)} · lưu lúc ${esc(r.t)}</div></div>
    <div class="g2"><label>Người thực hiện<select id="who">${staff.map(x => opt(x.id, cur ? cur.id : '', x.hoten)).join('')}${cur ? '' : opt('__old', '__old', r.nguoi)}</select></label>
    <label>Thời gian thực hiện<input id="when" type="datetime-local" value="${toLocal(r.t)}"></label></div>
    <div class="stick"><div class="bar"><i id="pb" style="width:0"></i></div><div class="mut" id="pt"></div></div>
    <div class="paper"><table class="ck hd"><tr><td>${esc(m.org || ORG)}<br><b>${esc(m.dept || '')}</b></td></tr><tr><td><b>${esc(m.title || r.qt.toUpperCase())}</b>${m.sub ? `<br>(${esc(m.sub)})` : ''}</td></tr></table>
    <table class="ck"><tr><th rowspan="2" style="width:36px">STT</th><th rowspan="2">Nội dung</th><th colspan="2">Lượng giá</th></tr>
    <tr><th style="width:54px">${esc(L[0])}</th><th style="width:54px">${esc(L[1])}</th></tr>${rows}
    <tr><td colspan="2" class="c"><b>Kết quả</b></td><td colspan="2" class="c"><b id="kq">0/${e.tot}</b></td></tr></table></div>
    <label>Ghi chú<textarea id="note" style="min-height:70px">${esc(r.ghichu)}</textarea></label>
    <button class="btn" onclick="saveEdit()">Lưu thay đổi</button> <button class="btn sec" onclick="cancelEr()">Hủy</button>`;
}
function saveEdit() {
  run(async () => {
    const e = S.er, r = e.rec, a = e.chk.filter(v => v === 0 || v === 1).length, d = e.chk.filter(v => v === 1).length;
    const nv = S.d.nv.find(x => x.id === $('#who').value), nguoi = nv ? nv.hoten : r.nguoi, cd = nv ? nv.chucdanh : r.cd;
    if (a < e.tot && !confirm(`Còn ${e.tot - a} bước chưa đánh giá. Vẫn lưu?`)) return;
    const t = fmtVN($('#when').value) || r.t;
    const ct = e.buoc.map((b, i) => isSec(b) ? b : (e.chk[i] === 1 ? '✔ ' : e.chk[i] === 0 ? '✘ ' : '○ ') + b).join('\n');
    const upd = {t, nguoi, cd, tile:`${d}/${e.tot}`, ct, ghichu:$('#note').value};
    await call('updateLog', {row:r.row, old:{t:r.t, khoa:r.khoa, qt:r.qt, nguoi:r.nguoi}, thoigian:t, nguoi, chucdanh:cd, tile:upd.tile, chitiet:ct, ghichu:upd.ghichu});
    await okFx();
    Object.assign(r, upd); S.hist.sort((x, y) => hkey(y.t).localeCompare(hkey(x.t)));
    S.er = null; S.open = null; toast('Đã cập nhật phiếu'); render();
  });
}

/* ---------- In phiếu (theo mẫu của bệnh viện) ---------- */
function printRec(r) {
  const q = S.d.qt.find(x => x.ten === r.qt) || {}, m = q.meta || {}, L = m.nhan || ['Đạt', 'Không đạt'];
  let n = 0, rows = '';
  (r.ct || '').split('\n').filter(Boolean).forEach(l => {
    if (isSec(l)) { n = 0; rows += `<tr><td colspan="4" class="s">${esc(l.slice(2))}</td></tr>`; return; }
    const ok = l[0] === '✔'; n++;
    rows += `<tr><td class="c">${n}</td><td>${esc(l.slice(2))}</td><td class="c">${ok ? '✓' : ''}</td><td class="c">${l[0] === '✘' ? '✓' : ''}</td></tr>`;
  });
  $('#sheet').innerHTML = `<table class="hdr">${LOGO ? `<tr><td rowspan="2" class="lg"><img src="${LOGO}"></td>` : '<tr>'}<td class="c">${esc(m.org || ORG)}<br><b>${esc(m.dept || '')}</b></td></tr>
    <tr><td class="c t">${esc(m.title || r.qt.toUpperCase())}${m.sub ? `<br><span style="font-weight:400">(${esc(m.sub)})</span>` : ''}</td></tr></table>
    <table class="info"><tr><td>Khoa/phòng được kiểm tra: <b>${esc(r.khoa || S.khoa)}</b></td><td>Ngày giờ: <b>${esc(r.t)}</b></td></tr>
    <tr><td>Người thực hiện: <b>${esc(r.nguoi)}</b></td><td>Kết quả: <b>${esc(r.tile)}</b></td></tr></table>
    <table><tr><th rowspan="2" style="width:9%">STT</th><th rowspan="2">Nội dung</th><th colspan="2">Lượng giá</th></tr>
    <tr><th style="width:12%">${esc(L[0])}</th><th style="width:14%">${esc(L[1])}</th></tr>${rows}
    <tr><td colspan="2" class="c"><b>Kết quả</b></td><td colspan="2" class="c"><b>${esc(r.tile)}</b></td></tr></table>
    ${r.ghichu ? `<p><b>Ghi chú:</b> ${esc(r.ghichu)}</p>` : ''}
    <table><tr><th>Trách nhiệm</th><th>Người thực hiện</th><th>Người kiểm tra</th></tr>
    <tr><td class="c"><b>Ký tên</b></td><td style="height:18mm"></td><td></td></tr>
    <tr><td class="c"><b>Họ và tên</b></td><td class="c"><b>${esc(r.nguoi)}</b></td><td></td></tr></table>
    ${m.capnhat ? `<p class="fn">Quy trình được cập nhật bởi ${esc(m.capnhat)}; xem xét bởi ${esc(m.xemxet || '')}.</p>` : ''}`;
  window.print();
}

/* ---------- Lịch sử, phiếu nhận, gửi phiếu ---------- */
const histSubs = () => [...(can('xemls') ? [['own', 'Phiếu của khoa']] : []), ...(can('nhan') ? [['in', 'Phiếu nhận được']] : [])];
const loadingBox = () => `<div class="loadbox"><i class="spin big"></i>Đang tải dữ liệu...</div><div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
function loadHist() {
  const id = S.lid = (S.lid || 0) + 1;
  S.loading = true; render();                    // hiện hiệu ứng đang tải ngay lập tức
  run(async () => {
    try {
      const inbox = S.hsub === 'in';
      const rows = inbox ? (await call('inbox', {khoa:S.khoa})).rows
        : (await call('history', {khoa:S.khoa})).rows.sort((a, b) => hkey(b.t).localeCompare(hkey(a.t)));
      if (id !== S.lid) return;                  // đã có lần tải mới hơn
      if (inbox) S.inbox = rows; else S.hist = rows;
      S.open = null; S.sel = [];
    } finally { if (id === S.lid) { S.loading = false; render(); } }
  });
}
function setSub(k) { S.hsub = k; S.selMode = false; S.open = null; loadHist(); }
function detail(x) {
  const L = (x.ct || '').split('\n').filter(Boolean).map(l => isSec(l) ? `<h3 class="sec">${esc(l.slice(2))}</h3>` : `<div class="qs ${l[0] === '✘' ? 'bad' : ''}">${esc(l[0])} ${esc(l.slice(2))}</div>`).join('');
  return `<div class="qv">${L || '<p class="mut">Phiếu này không có chi tiết.</p>'}${x.ghichu ? `<p><b>Ghi chú:</b> ${esc(x.ghichu)}</p>` : ''}</div>`;
}
function histRows() {
  const f = S.hf || '';
  return S.hist.map((x, i) => ({x, i})).filter(o => !f || hkey(o.x.t).slice(0, 8) === f.replace(/-/g, ''));
}
function tabHist() {
  if (S.er) return tabEdit();
  const subs = histSubs();

  const cap = t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  const base = t => cap(t.replace(/^quy\s*trình( kỹ thuật)?\s*/i, ''));
  const csub = t => cap(t.replace(/^\d+[.)]\s*/, '').replace(/:$/, '').trim().replace(/^quy\s*trình( kỹ thuật)?\s*/i, ''));
  const out = []; let meta = {org:'', dept:'', title:''}, seg = [], sub = '';
  for (const el of D.body.children) {
    if (el.tagName !== 'TABLE') { const t = /^(OL|UL)$/.test(el.tagName) ? tx(el.lastElementChild || el) : tx(el); if (t) sub = t; continue; }
    const rows = [...el.rows].map(r => [...r.cells].map(tx)), all = tx(el);
    if (rows.length === 2 && /QUY TRÌNH/i.test(all) && !/đạt/i.test(all)) {
      const ps = [...el.rows[0].cells].map(c => [...c.querySelectorAll('p')].map(tx).filter(Boolean)).filter(a => a.length)[0] || [];
      meta = {org:ps[0] || '', dept:ps[1] || '', title:rows[1].filter(Boolean).pop() || ''}; seg = []; continue;
    }
    if (/Người cập nhật/.test(all) && rows.length <= 4) { const n = rows[rows.length - 1]; seg.forEach(p => { p.meta.capnhat = n[1] || ''; p.meta.xemxet = n[2] || ''; }); continue; }
    const hi = rows.slice(0, 4).findIndex(r => r.some(c => /^(đạt|có)$/i.test(c)) && r.some(c => /^(không|chưa)( đạt)?$/i.test(c)));
    if (hi < 0) continue;
    const nhan = rows[hi].filter(c => /^(đạt|có|không|chưa)/i.test(c)).slice(0, 2).map(cap), buoc = [];
    for (const r of rows.slice(hi + 1)) {
      if (!r.some(Boolean)) continue;
      if (r.length === 1) { if (!RES.test(r[0])) buoc.push('# ' + r[0]); continue; }
      if (r.some(c => RES.test(c)) || !r[1]) continue;
      buoc.push(/^[IVX]+\.?$/.test(r[0]) && !r.slice(2).some(Boolean) ? '# ' + r[1] : r[1]);
    }
    if (buoc.filter(b => !isSec(b)).length < 3) continue;
    const p = {file:fname, sub, buoc, meta:{...meta, nhan}}; seg.push(p); out.push(p);
  }
  out.forEach(p => {
    const b = base(p.meta.title || fname.replace(/\.docx$/i, '')), multi = out.filter(x => x.meta.title === p.meta.title).length > 1, c = csub(p.sub);
    p.ten = multi && c ? (c.toLowerCase().split(' ').slice(0, 2).join() === b.toLowerCase().split(' ').slice(0, 2).join() ? c : b + ' – ' + c) : b;
    if (multi) p.meta.sub = c;
  });
  return out;
}
function importWord(el) {
  const fs = [...el.files]; if (!fs.length) return;
  run(async () => {
    if (typeof mammoth === 'undefined') throw new Error('Chưa tải được thư viện đọc Word, hãy kiểm tra mạng');
    let all = [];
    for (const f of fs) all = all.concat(await parseDocx(await f.arrayBuffer(), f.name));
    el.value = '';
    if (!all.length) throw new Error('Không tìm thấy bảng checklist (cột Đạt/Không đạt) trong file');
    S.imp = all.map(x => ({...x, sel:true})); render();
  });
}
function tabImp() {
  return `<h2>Tìm thấy ${S.imp.length} quy trình trong file Word</h2>
    ${S.user.role === 'admin' ? `<label>Phạm vi<select id="ik"><option value="*">Dùng chung cho mọi khoa</option><option value="${esc(S.khoa)}">Chỉ ${esc(S.khoa)}</option></select></label>` : ''}
    ${S.imp.map((x, i) => `<label class="step"><input type="checkbox" ${x.sel ? 'checked' : ''} onchange="S.imp[${i}].sel=this.checked"><span>${esc(x.ten)}<br><small class="mut">${x.buoc.filter(b => !isSec(b)).length} bước · ${esc(x.file)}</small></span></label>`).join('')}
    <p><button class="btn" onclick="doImp()">Nhập các quy trình đã chọn</button> <button class="btn sec" onclick="S.imp=null;render()">Hủy</button></p>`;
}
function doImp() {
  run(async () => {
    const list = S.imp.filter(x => x.sel).map(({ten, buoc, meta}) => ({ten, buoc, meta}));
    if (!list.length) throw new Error('Chưa chọn quy trình nào');
    await call('saveMany', {khoa:S.user.role === 'admin' ? $('#ik').value : S.khoa, list});
    await okFx();
    S.imp = null; await reload(); toast(`Đã nhập ${list.length} quy trình`); render();
  });
}

/* ---------- Nhân sự & Khoa/phòng (admin) ---------- */
function tabNv() {
  const u = S.user, adm = u.role === 'admin', e = S.edit, X = S.xfer;
  if (e) {
    const lock = e.old && e.khoa;
    const khoaOpts = adm ? S.d.khoa : [u.khoa];
    return `<h2>${e.old ? 'Sửa' : 'Thêm'} nhân viên</h2>
    <label>Họ tên<input id="fh" value="${esc(e.hoten)}"></label>
    <label>Năm sinh<input id="fn" inputmode="numeric" maxlength="4" placeholder="VD: 1990" value="${esc(e.namsinh)}"></label>
    <label>Chức danh<input id="fc" value="${esc(e.chucdanh)}" placeholder="VD: Điều dưỡng, Bác sĩ, KTV..."></label>
    <label>Khoa/phòng<select id="fk" ${lock || !adm ? 'disabled' : ''}><option value="">— Không thuộc khoa nào —</option>${khoaOpts.map(k => opt(k, e.khoa)).join('')}</select></label>
    ${lock ? '<div class="mut">Muốn đổi khoa/phòng, dùng nút "Chuyển khoa" trong danh sách (khoa nhận phải bấm chấp nhận).</div>' : ''}
    ${adm ? `<label class="remember"><input id="fa" type="checkbox" ${e.acc ? 'checked' : ''} onchange="togAcc()">Có tài khoản đăng nhập (không bắt buộc)</label>
    <div id="accbox" style="display:${e.acc ? 'block' : 'none'}">
      <label>Tên đăng nhập<input id="fu" autocomplete="off" value="${esc(e.username)}" ${e.old && e.username ? 'readonly' : ''}></label>
      <label>Mật khẩu ${e.old && e.username ? '(để trống nếu không đổi)' : ''}<input id="fp" type="password" autocomplete="new-password"></label>
      <label>Nhóm quyền (đặt sẵn các quyền bên dưới)<select id="fr" onchange="roleChg()">${Object.keys(ROLE).map(r => opt(r, e.role || 'nhanvien', ROLE[r])).join('')}</select></label>
      <div class="card"><b>Quyền chi tiết</b><div class="mut">Tài khoản chỉ thấy dữ liệu của khoa/phòng mình. Quản trị luôn có đủ quyền.</div>
      ${Object.keys(PERM_LBL).map(k => `<label class="remember"><input type="checkbox" class="fq" value="${k}" ${(e.role === 'admin' || (e.quyen || []).includes(k)) ? 'checked' : ''} ${e.role === 'admin' ? 'disabled' : ''}>${PERM_LBL[k]}</label>`).join('')}</div>
    </div>` : ''}
    <button class="btn" onclick="saveStaff()">Lưu</button> <button class="btn sec" onclick="cancelEdit()">Hủy</button>`;
  }
  if (X) {
    const x = S.d.nv.find(n => n.id === X.id);
    if (x) return `<h2>Chuyển khoa/phòng</h2>
    <div class="card"><b>${esc(x.hoten)}</b><div class="mut">Hiện thuộc: ${esc(x.khoa || 'Toàn viện')}</div></div>
    <label>Chuyển đến<select id="xd"><option value="">— Chọn khoa/phòng —</option>${(S.d.khoaAll || []).filter(k => k !== x.khoa).map(k => opt(k, '')).join('')}</select></label>
    <div class="mut" style="margin-bottom:12px">Nhân viên vẫn thuộc khoa hiện tại cho đến khi khoa nhận bấm "Chấp nhận".</div>
    <button class="btn" onclick="sendXfer('${esc(x.id)}')">Gửi đề nghị chuyển</button> <button class="btn sec" onclick="S.xfer=null;render()">Hủy</button>`;
    S.xfer = null;
  }
  const inc = S.d.nv.filter(x => x.khoachuyen && (adm || x.khoachuyen === u.khoa));
  return `${adm ? `<h2>Khoa/phòng</h2>
    <div class="row"><input id="nk" placeholder="Tên khoa/phòng mới"><button class="btn" onclick="addK()" style="flex:none">Thêm</button></div>
    ${S.d.khoa.map(k => `<div class="row card"><span>${esc(k)}</span><button class="lnk d" onclick="delK(this.dataset.k)" data-k="${esc(k)}">Xóa</button></div>`).join('')}` : ''}
    ${inc.length ? `<h2>Đề nghị chuyển khoa chờ xử lý</h2>${inc.map(x => `<div class="card" style="border-color:var(--warn)"><b>${esc(x.hoten)}</b> ${x.namsinh ? `<span class="tag">${esc(x.namsinh)}</span>` : ''}
      <div class="mut">${esc(x.chucdanh)} · từ <b>${esc(x.khoa || 'Toàn viện')}</b> → <b>${esc(x.khoachuyen)}</b></div>
      <div class="mut">Người đề nghị: ${esc(x.nguoichuyen)} · ${esc(x.tgchuyen)}</div>
      <div style="margin-top:6px"><button class="btn" onclick="answerXfer('${esc(x.id)}',true)">Chấp nhận</button> <button class="lnk d" onclick="answerXfer('${esc(x.id)}',false)">Từ chối</button></div></div>`).join('')}` : ''}
    <h2>Nhân viên</h2><button class="btn" onclick="newStaff()">+ Thêm nhân viên</button>
    <input id="nq" style="margin-top:10px" placeholder="Tìm theo tên, năm sinh, chức danh, khoa..." value="${esc(S.q || '')}" oninput="S.q=this.value;$('#nvl').innerHTML=nvList()">
    <div id="nvl">${nvList()}</div>`;
}
function nvList() {
  const u = S.user, adm = u.role === 'admin', q = (S.q || '').toLowerCase().trim();
  const list = S.d.nv.filter(x => adm || x.khoa === u.khoa)
    .filter(x => !q || [x.hoten, x.namsinh, x.chucdanh, x.khoa].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.khoa || '').localeCompare(b.khoa || '', 'vi') || a.hoten.localeCompare(b.hoten, 'vi'));
  if (!list.length) return '<p class="mut">Không có nhân viên nào.</p>';
  return list.map(x => `<div class="card"><div class="row" style="flex-wrap:wrap"><div><b>${esc(x.hoten)}</b> ${x.namsinh ? `<span class="tag">${esc(x.namsinh)}</span>` : ''} ${x.role ? `<span class="tag">${esc(ROLE[x.role] || x.role)}</span>` : ''}
      <div class="mut">${esc(x.chucdanh)} · ${esc(x.khoa || 'Toàn viện')}${x.username ? ' · ' + esc(x.username) : ''}</div>
      ${x.khoachuyen ? `<div class="mut" style="color:var(--warn)">Đang chờ ${esc(x.khoachuyen)} chấp nhận chuyển</div>` : ''}</div>
      <div><button class="lnk" onclick="editStaff('${esc(x.id)}')">Sửa</button>${x.khoachuyen ? `<button class="lnk" onclick="cancelXfer('${esc(x.id)}')">Hủy chuyển</button>` : (x.khoa ? `<button class="lnk" onclick="S.xfer={id:'${esc(x.id)}'};render()">Chuyển khoa</button>` : '')}<button class="lnk d" onclick="delStaff('${esc(x.id)}')">Xóa</button></div></div></div>`).join('');
}
const PERM_LBL = {lam:'Làm và lưu checklist', xemls:'Xem lịch sử phiếu của khoa', gui:'Gửi phiếu sang khoa/phòng khác', nhan:'Xem phiếu nhận được', baocao:'Xem báo cáo', qt:'Sửa quy trình của khoa', nhansu:'Quản lý nhân viên của khoa'};
const DEFP = {admin:Object.keys(PERM_LBL), truong:Object.keys(PERM_LBL), nhanvien:['lam', 'xemls']};
function roleChg() { const r = $('#fr').value; document.querySelectorAll('.fq').forEach(c => { c.checked = DEFP[r].includes(c.value); c.disabled = r === 'admin'; }); }
function newStaff() { S.edit = {id:'', hoten:'', namsinh:'', chucdanh:'', khoa:S.user.role === 'admin' ? S.khoa : S.user.khoa, username:'', role:'nhanvien', acc:false, quyen:DEFP.nhanvien.slice()}; render(); }
function editStaff(id) { const x = S.d.nv.find(n => n.id === id); S.edit = {...x, old:1, acc:!!x.username, quyen:x.quyen || DEFP.nhanvien.slice()}; render(); }
function togAcc() { $('#accbox').style.display = $('#fa').checked ? 'block' : 'none'; }
function saveStaff() {
  run(async () => {
    const e = S.edit, adm = S.user.role === 'admin';
    const p = {id:e.id, hoten:$('#fh').value.trim(), namsinh:$('#fn').value.trim(), chucdanh:$('#fc').value.trim(), khoa:$('#fk').value};
    if (!p.hoten) throw new Error('Nhập họ tên');
    if (!p.namsinh && !(e.old && !e.namsinh)) throw new Error('Nhập năm sinh (4 chữ số)');
    if (adm) {
      p.acc = {on:$('#fa').checked, username:$('#fu').value.trim(), matkhau:$('#fp').value, role:$('#fr').value, quyen:[...document.querySelectorAll('.fq')].filter(c => c.checked).map(c => c.value)};
      if (p.acc.on && !p.acc.username) throw new Error('Nhập tên đăng nhập');
      if (!p.acc.on && e.old && e.username && !confirm('Bỏ tài khoản đăng nhập của nhân viên này?')) return;
    }
    await call('saveStaff', p); await reload(); await okFx(); S.edit = null; toast('Đã lưu nhân viên'); render();
  });
}
function delStaff(id) { if (confirm('Xóa nhân viên này?')) run(async () => { await call('delStaff', {id}); await okFx(); await reload(); toast('Đã xóa'); render(); }); }
function sendXfer(id) { run(async () => { const den = $('#xd').value; if (!den) throw new Error('Chọn khoa/phòng cần chuyển đến'); await call('reqTransfer', {id, den}); await okFx(); S.xfer = null; await reload(); toast('Đã gửi đề nghị, chờ khoa nhận chấp nhận'); render(); }); }
function cancelXfer(id) { run(async () => { await call('cancelTransfer', {id}); await okFx(); await reload(); toast('Đã hủy đề nghị chuyển'); render(); }); }
function answerXfer(id, ok) { if (!ok && !confirm('Từ chối nhận nhân viên này?')) return; run(async () => { await call('respondTransfer', {id, accept:ok}); await okFx(); await reload(); toast(ok ? 'Đã chấp nhận, nhân viên chuyển sang khoa mới' : 'Đã từ chối'); render(); }); }
function addK() { run(async () => { const t = $('#nk').value.trim(); if (!t) return; await call('addKhoa', {ten:t}); await okFx(); await reload(); render(); }); }
function delK(k) { if (confirm(`Xóa "${k}"? (Quy trình và nhân viên của khoa không bị xóa)`)) run(async () => { await call('delKhoa', {ten:k}); await okFx(); await reload(); render(); }); }

/* ---------- Khởi động ---------- */
(async () => {
  try { const s = JSON.parse(sessionStorage.getItem('ck')); if (s) { S.token = s.token; S.user = s.user; await reload(); } } catch (e) { S.user = S.token = null; }
  render();
})();
</script>
